version: "3.3"
services:
  dev:
    build: .
    volumes:
      - ..:/workspace:cached
      - /home/mlykes/.claude:/home/mlykes/.claude          # Claude Code auth + settings
      - /home/mlykes/.ssh:/home/mlykes/.ssh:ro             # SSH keys for git
    environment:
      TERM: xterm-256color
      DATABASE_URL: jdbc:postgresql://dev-db:5432/opetopic
    command: sleep infinity
    depends_on:
      - dev-db
    networks:
      default:
      opetopic-proxy:
        aliases:
          - opetopic-dev   # nginx.dev.conf routes /opetopic → opetopic-dev:9000

  dev-db:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: opetopic
      POSTGRES_USER: opetopic
      POSTGRES_PASSWORD: devpassword
    volumes:
      - dev-db-data:/var/lib/postgresql/data

volumes:
  dev-db-data:

networks:
  opetopic-proxy:
    external: true
